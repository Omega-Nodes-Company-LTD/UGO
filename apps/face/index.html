<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b0b10" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <!-- installed from the browser menu, it launches without chrome: the dock
         should show a creature, not a URL bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <title>UGO</title>
    <style>
      /* `hidden` has to win. Every panel here sets its own display on an id
         selector, which outranks the browser's `[hidden] { display: none }`
         and leaves a "closed" panel sitting on screen. This has now bitten
         the gate and the scroll: one rule instead of one per panel. */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b10;
        overflow: hidden;
        touch-action: manipulation;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: relative;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom));
        color: #cfcfe0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        font-size: 0.9rem;
      }
      #speak-text {
        position: absolute;
        left: 50%;
        bottom: 18%;
        transform: translateX(-50%);
        max-width: 80%;
        color: #ffe9ef;
        background: rgba(20, 20, 30, 0.7);
        border-radius: 1rem;
        padding: 0.5rem 1rem;
        text-align: center;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #speak-text.visible {
        opacity: 1;
      }
      #log {
        position: absolute; right: 1rem; bottom: 4.5rem; width: min(26rem, calc(100% - 2rem));
        max-height: min(60vh, 30rem); display: flex; flex-direction: column;
        background: #14141ae6; backdrop-filter: blur(10px); border: 1px solid #ffffff1f;
        border-radius: .8rem; color: #f2f0ec; font-size: .9rem; overflow: hidden;
      }
      #log header {
        display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem;
        border-bottom: 1px solid #ffffff14;
      }
      #log header b { flex: 1; font-size: .85rem; font-weight: 600; }
      #log header button {
        font-size: .75rem; padding: .25rem .6rem; font-family: inherit;
        background: #21212e; color: #cfcfe0; border: 1px solid #3a3a4c;
        border-radius: 999px; cursor: pointer;
      }
      #log ol { margin: 0; padding: .5rem .8rem 1rem; list-style: none; overflow-y: auto; }
      #log li { padding: .3rem 0; border-bottom: 1px solid #ffffff0f; line-height: 1.4; }
      #log li:last-child { border-bottom: 0; }
      #log .when { color: #ffffff66; font-size: .72rem; margin-right: .4rem;
                   font-variant-numeric: tabular-nums; }
      #log .who { font-weight: 600; }
      #log li.mine .who { color: #b9c7ff; }
      #log .empty { color: #ffffff66; padding: .6rem 0; }
      /* the bubble is the same sentence, six seconds of it, and the scroll
         sits right on top of it. With the scroll open the line is already
         there and arrives live: showing it twice only hid half of each. */
      #app[data-log="on"] #speak-text { opacity: 0; }

      #room-pick {
        background: #21212e;
        color: #cfcfe0;
        border: 1px solid #3a3a4c;
        border-radius: 999px;
        padding: 0.4rem 0.7rem;
        font: inherit;
        font-size: 0.8rem;
        max-width: 12rem;
      }
      #btn-mic,
      #btn-log,
      #btn-ears {
        background: #21212e;
        color: #cfcfe0;
        border: 1px solid #3a3a4c;
        border-radius: 999px;
        padding: 0.4rem 0.9rem;
      }
      /* while the ears are on, the button says so without being shouted at */
      #app[data-ears="on"] #btn-ears {
        border-color: #6a6a8c;
        color: #eaeaf5;
      }
      #conn {
        font-size: 0.75rem;
        opacity: 0.7;
      }
      #rec-banner {
        position: absolute;
        top: env(safe-area-inset-top, 0.6rem);
        left: 50%;
        transform: translateX(-50%);
        background: #c62828;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.15em;
        border-radius: 999px;
        padding: 0.35rem 1.1rem;
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.55;
        }
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(5, 5, 10, 0.92);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        color: #cfcfe0;
      }
      [data-mode="portable"] #hud button.home-only {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app" data-testid="app" data-state="idle" data-connected="false">
      <canvas id="face" data-testid="face-canvas"></canvas>
      <p id="speak-text" data-testid="speak-text"></p>
      <div id="rec-banner" data-testid="rec-banner" hidden>● REC</div>
      <div id="privacy-overlay" data-testid="privacy-overlay" class="overlay" hidden>
        <div style="font-size: 3rem">😴 z z z</div>
        <p>Privacy mode: microfono e registrazione spenti davvero.</p>
        <button id="btn-privacy-off" data-testid="btn-privacy-off" type="button">Risveglia UGO</button>
      </div>
      <div id="qr-overlay" data-testid="qr-overlay" class="overlay" hidden>
        <p>Piacere, UGO 🐷 — inquadra per i contatti</p>
        <canvas id="qr-canvas" data-testid="qr-canvas" width="240" height="240"></canvas>
        <button id="btn-qr-close" data-testid="btn-qr-close" type="button">Chiudi</button>
      </div>
      <aside id="log" data-testid="log" hidden>
        <header>
          <b>Cosa è stato detto</b>
          <button id="log-clear" data-testid="log-clear" type="button">svuota</button>
          <button id="log-close" data-testid="log-close" type="button">chiudi</button>
        </header>
        <ol id="log-lines" data-testid="log-lines"></ol>
      </aside>
      <div id="hud">
        <span id="mood-label" data-testid="mood-label"></span>
        <button id="btn-mic" data-testid="btn-mic" class="home-only" type="button">🎤 attiva sensi</button>
        <button id="btn-ears" data-testid="btn-ears" class="home-only" type="button" hidden>
          👂 ti ascolto
        </button>
        <button id="btn-rec" data-testid="btn-rec" type="button" hidden>● REC</button>
        <button id="btn-privacy" data-testid="btn-privacy" type="button" hidden>😴 privacy</button>
        <button id="btn-card" data-testid="btn-card" type="button" hidden>🪪 QR</button>
        <!-- ADR-037: which room this device is. Hidden until there is more
             than one to choose from — a picker with one option is furniture. -->
        <select id="room-pick" data-testid="room-pick" title="che stanza è questo schermo" hidden></select>
        <!-- ADR-038: la nuvoletta dura sei secondi; questo resta. -->
        <button id="btn-log" data-testid="btn-log" type="button" title="cosa è stato detto">
          💬 detto
        </button>
        <span id="conn" data-testid="conn-status">disconnesso</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
