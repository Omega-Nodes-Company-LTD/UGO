[package]
name = "ugo-dictation"
version = "0.1.0"
description = "UGO Dettatura: detta in qualunque app del Mac, trascritto dal faster-whisper di casa"
authors = ["Omega Nodes"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "ugo_dictation"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
cpal = "0.15"
arboard = "3"
enigo = "0.2"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
macos-accessibility-client = "0.0.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
