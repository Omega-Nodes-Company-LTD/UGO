# UGO — dev stack (ADR-007: local-first, zero public exposure).
# Datastores publish NO host port and live on an internal network; the only
# port reaching the host is soul's HTTP on 127.0.0.1:3000.
# Prerequisites: cp .env.example .env, then ops/docker/mosquitto/generate-passwd.sh
# Run from the repo root: docker compose -f ops/docker/compose.dev.yml up -d --build

name: ugo-dev

networks:
  backend:
    internal: true
  edge: {}
  # ADR-051: la rete della reception — solo lei e soul. La reception NON sta
  # su `backend`: Postgres, Ollama e Mosquitto le restano irraggiungibili
  # anche da compromessa.
  reception-net:
    internal: true

volumes:
  postgres-data: {}
  mosquitto-data: {}
  ollama-models: {}
  # ADR-054: i cloni dei repo dei clienti vivono qui, non nell'immagine
  customer-repos: {}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks: [backend]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mosquitto/.generated/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h localhost -u \"$${MQTT_HEALTH_USER}\" -P \"$${MQTT_HEALTH_PASS}\" -t ugo/health -m ping -q 0 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      MQTT_HEALTH_USER: ${MQTT_USER:?missing MQTT_USER}
      MQTT_HEALTH_PASS: ${MQTT_PASS:?missing MQTT_PASS}

  # ADR-063: la finestra sul mondo — un metamotore in casa, zero chiavi, zero
  # costi per query. Nessuna porta sull'host (regola 4): ci parla solo soul.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    networks: [backend]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    networks: [backend]
    volumes:
      - ollama-models:/root/.ollama
    # CPU only (ADR-001); cap memory so a model can't starve the host
    mem_limit: 12g
    healthcheck:
      test: ["CMD", "ollama", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # the dream (Fase 3): run on demand in dev with
  #   docker compose -f ops/docker/compose.dev.yml run --rm jobs
  # (production schedule: Coolify scheduled task, 02:30 Europe/Rome)
  jobs:
    build:
      context: ../..
      dockerfile: ops/docker/jobs.Dockerfile
    profiles: [jobs]
    networks: [backend]
    environment:
      DATABASE_URL: ${DATABASE_URL:?missing DATABASE_URL}
      OLLAMA_URL: ${OLLAMA_URL:?missing OLLAMA_URL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_BATCH_MODEL: ${OLLAMA_BATCH_MODEL:?missing OLLAMA_BATCH_MODEL}
      UGO_DATA_KEY: ${UGO_DATA_KEY:?missing UGO_DATA_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:?missing S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?missing S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?missing S3_SECRET_KEY}
      S3_BUCKET_BACKUP: ${S3_BUCKET_BACKUP:-ugo-backup}
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO:-ugo-audio}
      UGO_WHISPER_MODEL: ${UGO_WHISPER_MODEL:-large-v3}
      UGO_AUDIO_RETENTION_DAYS: ${UGO_AUDIO_RETENTION_DAYS:-90}
      # ADR-054 — le fonti dei clienti (0 = sincronizzazione spenta)
      UGO_CUSTOMER_SYNC_EVERY_H: ${UGO_CUSTOMER_SYNC_EVERY_H:-6}
      UGO_REPOS_DIR: /var/lib/ugo/repos
      S3_BUCKET_DOCS: ${S3_BUCKET_DOCS:-ugo-docs}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - customer-repos:/var/lib/ugo/repos
    depends_on:
      postgres:
        condition: service_healthy

  # ADR-045: il riconoscimento che risponde nello stesso secondo. Tiene gli
  # encoder in memoria — caricarli a ogni richiesta significherebbe secondi,
  # cioè non farlo. Sulla rete interna e basta: **nessuna porta pubblicata**,
  # perché un servizio che dice chi sei non deve essere raggiungibile da fuori.
  percezione:
    build:
      context: ../..
      dockerfile: ops/docker/percezione.Dockerfile
    profiles: [percezione]
    networks: [backend]
    environment:
      DATABASE_URL: ${DATABASE_URL:?missing DATABASE_URL}
      UGO_DATA_KEY: ${UGO_DATA_KEY:?missing UGO_DATA_KEY}
      UGO_INTERNAL_TOKEN: ${UGO_INTERNAL_TOKEN:?missing UGO_INTERNAL_TOKEN}
      # ADR-047: il container se li scarica all'avvio, PRIMA di aprire la
      # porta — mai durante una conversazione
      UGO_VOICE_MODEL_DIR: /models/spkrec-ecapa-voxceleb
      UGO_FACE_MODEL: /models/arcface/model.onnx
      TZ: ${TZ:-Europe/Rome}
    volumes:
      # scrivibile: il container si procura da solo i pesi al primo avvio
      # (ADR-047). Volume persistente, o li riscarica a ogni riavvio.
      - ${UGO_MODELS_DIR:-./models}:/models
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    depends_on:
      postgres:
        condition: service_healthy

  # one-shot: applies drizzle migrations (the only sanctioned way to touch
  # the schema, CLAUDE.md rule 5) using the same image as soul
  migrate:
    build:
      context: ../..
      dockerfile: ops/docker/soul.Dockerfile
    command: ["node", "node_modules/@ugo/db/dist/migrate-cli.js"]
    restart: "no"
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: ${DATABASE_URL:?missing DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # ADR-051: la porta sulla strada. In dev ascolta su loopback come tutto il
  # resto; in produzione è l'unico servizio col dominio pubblico.
  reception:
    build:
      context: ../..
      dockerfile: ops/docker/reception.Dockerfile
    restart: unless-stopped
    networks: [reception-net, edge]
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SOUL_URL: http://soul:3000
      UGO_RECEPTION_TOKEN: ${UGO_RECEPTION_TOKEN:-}
      PORT: "3001"
    depends_on:
      soul:
        condition: service_started

  soul:
    build:
      context: ../..
      dockerfile: ops/docker/soul.Dockerfile
    restart: unless-stopped
    networks: [backend, edge, reception-net]
    # the ONLY host-published port of the stack, loopback only
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: ${DATABASE_URL:?missing DATABASE_URL}
      MQTT_URL: ${MQTT_URL:?missing MQTT_URL}
      MQTT_USER: ${MQTT_USER:?missing MQTT_USER}
      MQTT_PASS: ${MQTT_PASS:?missing MQTT_PASS}
      OLLAMA_URL: ${OLLAMA_URL:?missing OLLAMA_URL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?missing ANTHROPIC_API_KEY}
      UGO_CHAT_MODEL: ${UGO_CHAT_MODEL:-claude-haiku-4-5}
      UGO_DAILY_BUDGET_USD: ${UGO_DAILY_BUDGET_USD:-0.50}
      UGO_DATA_KEY: ${UGO_DATA_KEY:?missing UGO_DATA_KEY}
      # rotte protette (oblio/export/sogno/riunioni/presign). L'immagine gira
      # con NODE_ENV=production, quindi il token è richiesto anche in dev:
      # environment parity, e si prova subito quello che si userà davvero.
      UGO_INTERNAL_TOKEN: ${UGO_INTERNAL_TOKEN:?missing UGO_INTERNAL_TOKEN}
      UGO_JOBS_TRIGGER_URL: ${UGO_JOBS_TRIGGER_URL:-}
      # ADR-051/055 — la reception (facoltativa: senza segreto resta chiusa)
      UGO_RECEPTION_TOKEN: ${UGO_RECEPTION_TOKEN:-}
      UGO_CUSTOMER_HOURLY_MESSAGES: ${UGO_CUSTOMER_HOURLY_MESSAGES:-20}
      UGO_CUSTOMER_DAILY_BUDGET_USD: ${UGO_CUSTOMER_DAILY_BUDGET_USD:-0.25}
      S3_BUCKET_DOCS: ${S3_BUCKET_DOCS:-}
      # Fase 4 — upload audio (facoltative in dev: la feature si attiva solo se tutte presenti)
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO:-}
      # Fase 5 — riunioni (facoltative in dev)
      VEXA_API_URL: ${VEXA_API_URL:-}
      VEXA_API_KEY: ${VEXA_API_KEY:-}
      UGO_OWNER_NAME: ${UGO_OWNER_NAME:-casa}
      PORT: "3000"
      TZ: ${TZ:-Europe/Rome}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
      ollama:
        condition: service_started
