# Mosquitto dev configuration — auth mandatory, private Docker network only.
# The listener binds inside the container; NO host port is published
# (CLAUDE.md rule 4). The password file is generated locally by
# generate-passwd.sh from .env values and is never committed.

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/

# stdout logging, no client payloads
log_dest stdout
log_type error
log_type warning
log_type notice
