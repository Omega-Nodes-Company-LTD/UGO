# ACL — least privilege per client (PROGETTO §4.4, SECURITY_COMPLIANCE §4).
# Topic contract: packages/shared/src/constants.ts (PROGETTO §5.7).

# soul-api: full access to the ugo namespace, nothing else
user soul
topic readwrite ugo/#

# Nano 33 IoT firmware: publishes telemetry/acks, subscribes to commands only
user nano
topic write ugo/env
topic write ugo/status
topic write ugo/relay/+/state
topic read ugo/relay/+/set
topic read ugo/oled
