[project]
name = "ugo-jobs"
version = "0.1.0"
description = "UGO night jobs: the dream (reflection, hygiene, backup) — PROGETTO §5.6"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "boto3>=1.35",
    "pydantic>=2.9",
    "cryptography>=43.0",
    # ingest.py transcribes on CPU (ADR-001); heavy, imported lazily
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "testcontainers[postgres,minio]>=4.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
