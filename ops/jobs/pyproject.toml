[project]
name = "ugo-jobs"
version = "0.1.0"
description = "UGO night jobs: the dream (reflection, hygiene, backup) — PROGETTO §5.6"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "boto3>=1.35",
    "pydantic>=2.9",
    "cryptography>=43.0",
    # ingest.py transcribes on CPU (ADR-001); heavy, imported lazily
    "faster-whisper>=1.1",
    # Il tetto su PyAV, e non è un capriccio: `faster-whisper` 1.1–1.2.1 chiama
    # `av.open(..., metadata_errors="ignore")` dentro `audio.py`, e **PyAV 19.0.0
    # ha rimosso quell'argomento**. Dichiarando `av>=11` senza limite, pip
    # installa la 19 e ogni trascrizione muore con
    # «TypeError: open() got an unexpected keyword argument 'metadata_errors'»:
    # erano cinque test di `test_ingest.py` rossi in CI.
    #
    # Il vincolo sta qui perché a monte non c'è: l'ultima release di
    # faster-whisper è dell'ottobre 2025 e il problema è ancora aperto, quindi
    # non arriva nessuna correzione a togliercelo di mano.
    #
    # Misurato su Python 3.12 (la stessa minor della CI), entrambi i lati:
    # con `av 19.0.1` la chiamata solleva quel TypeError, con `av 18.1.0`
    # l'argomento è accettato. `<19` e non un pin esatto: le patch delle 18.x
    # restano disponibili, e il giorno che una rompesse si stringe con la
    # misura in mano, non per sospetto.
    "av<19",
    # customer_docs.py (ADR-054): pure-python pdf text extraction, imported lazily
    "pypdf>=5.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "testcontainers[postgres,minio]>=4.8",
]
# ADR-042: il riconoscimento vocale vero. Separato dal resto perché si porta
# dietro torch (~2 GB): il job notturno che scrive il diario non lo deve pagare.
voice = [
    "torch>=2.4",
    "speechbrain>=1.0",
]
# solo per il banco di misura: legge il flac del corpus senza altri strati
bench = [
    "soundfile>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
