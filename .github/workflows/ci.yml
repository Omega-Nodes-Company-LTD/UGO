name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # tests pull real containers; keep Testcontainers quiet and reuse-free
  TESTCONTAINERS_RYUK_DISABLED: "false"

jobs:
  # Fast gate: types, lint and pure unit tests. Must stay under a couple of
  # minutes so a red build is noticed while the change is still fresh.
  static:
    name: build · lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build lint typecheck test
      - name: audit (blocks on HIGH/CRITICAL only)
        run: pnpm audit --audit-level high

  # Real infrastructure, per TESTING_PLAYBOOK: Postgres+pgvector, Mosquitto,
  # MinIO and Ollama containers. ubuntu-latest ships a working Docker daemon.
  integration:
    name: integration (real containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Questa cache non ha MAI funzionato: `Cache not found` in ingresso a ogni
      # run, e in uscita `tar: Cannot open: Permission denied` su due file che
      # il container di Ollama crea con l'uid suo — `id_ed25519` e
      # `cache/model-recommendations.json`. Un file solo illeggibile fa uscire
      # tar con 2, e actions/cache scarta l'intero archivio: risultato, ogni
      # run riscaricava i pesi da capo e nessuno se ne accorgeva, perché il
      # fallimento è un `warning` in fondo al job.
      #
      # I due file non sono pesi e non servono a niente qui (uno è per giunta
      # una chiave privata, che in una cache non ci deve stare): si buttano
      # prima del passo di salvataggio, e resta solo ciò che vale la pena
      # tenere. Lo stesso passo sta nei tre job che condividono la cache.
      - name: cache the embedding model between runs
        uses: actions/cache@v4
        with:
          path: ~/.ugo-ollama
          # ADR-107: questo job vuole anche il modello di TESTO per il giudice
          # dell'astensione, quindi ha una chiave sua. Condividerla con e2e —
          # che il testo non lo usa — faceva correre i due job per la stessa
          # chiave, e chi arrivava secondo non salvava niente.
          key: ollama-nomic-qwen15-v1
      - run: mkdir -p ~/.ugo-ollama
      - run: pnpm test:integration
        env:
          UGO_TEST_OLLAMA_MODELS: /home/runner/.ugo-ollama
      - name: lascia nella cache solo i pesi, e leggibili
        if: always()
        run: sudo rm -rf ~/.ugo-ollama/cache ~/.ugo-ollama/id_ed25519 ~/.ugo-ollama/id_ed25519.pub

  e2e:
    name: e2e (real browser vs real soul)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter face exec playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.ugo-ollama
          key: ollama-nomic-embed-text-v1
      - run: mkdir -p ~/.ugo-ollama
      - run: pnpm test:e2e
        env:
          UGO_TEST_OLLAMA_MODELS: /home/runner/.ugo-ollama
      - name: lascia nella cache solo i pesi, e leggibili
        if: always()
        run: sudo rm -rf ~/.ugo-ollama/cache ~/.ugo-ollama/id_ed25519 ~/.ugo-ollama/id_ed25519.pub
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/face/test-results/
          retention-days: 7

  jobs-python:
    name: jobs (dream, whisper on CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Un mirror apt che non risponde ha bloccato questo passo tre volte
      # (19/08/2026). Le prime due bruciavano i 30 minuti del job; la terza ha
      # mostrato la causa e un difetto della prima correzione.
      #
      # La causa: `azure.archive.ubuntu.com` — il mirror di default sui runner —
      # smette di rispondere (`Ign:` in ciclo) mentre `archive.ubuntu.com` sta
      # in piedi. Da qui il terzo tentativo, che cambia mirror invece di
      # ripetere lo stesso identico comando sperando in bene.
      #
      # Il difetto: il tetto stava sul PASSO, che conteneva tre tentativi. Il
      # primo tentativo appeso se lo mangiava tutto e i retry non partivano mai
      # — una correzione che si contraddiceva da sola. Adesso il tetto è su
      # ogni tentativo, e il passo ha budget per usarli.
      #
      # Il difetto DELLA correzione, che ha fatto rosso main: il tetto stava
      # anche sull'`install`, e novanta secondi non bastano a scompattare
      # espeak-ng con le sue dipendenze — apt e stato ucciso durante «Setting
      # up», e un dpkg interrotto rende impossibili tutti i tentativi dopo.
      # Ora il tetto sta dove il blocco e stato osservato davvero (`update`,
      # che parla col mirror), l'installazione non si interrompe mai a meta, e
      # ogni tentativo ripara un dpkg lasciato a meta da chiunque.
      - name: espeak-ng provides the synthetic voice for the ingest fixture
        timeout-minutes: 10
        run: |
          try_apt() {
            # Un tentativo ucciso a meta lascia dpkg interrotto, e da li in poi
            # OGNI tentativo muore con «dpkg was interrupted»: e cosi che main
            # e diventato rosso il 2026-08-19. Si ripara prima di riprovare.
            sudo dpkg --configure -a || true
            timeout 120 sudo apt-get update -o Acquire::Retries=2 \
              && sudo apt-get install -y --no-install-recommends \
                   -o Acquire::Retries=2 espeak-ng
          }
          for attempt in 1 2 3; do
            if [ "$attempt" = 3 ]; then
              echo "cambio mirror: azure non risponde, provo archive.ubuntu.com"
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            if try_apt; then exit 0; fi
            echo "apt non ha risposto (tentativo $attempt/3)"
            sleep 10
          done
          echo "::error::apt non risponde nemmeno cambiando mirror: e infrastruttura, non il diff"
          exit 1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.ugo-ollama
            ~/.ugo-whisper
          key: models-nomic-whisperbase-v1
      - run: mkdir -p ~/.ugo-ollama ~/.ugo-whisper
      - working-directory: ops/jobs
        run: pip install -e ".[test]"
      - working-directory: ops/jobs
        run: pytest -q
        env:
          UGO_TEST_OLLAMA_MODELS: /home/runner/.ugo-ollama
          UGO_TEST_WHISPER_MODELS: /home/runner/.ugo-whisper
      - name: lascia nella cache solo i pesi, e leggibili
        if: always()
        run: sudo rm -rf ~/.ugo-ollama/cache ~/.ugo-ollama/id_ed25519 ~/.ugo-ollama/id_ed25519.pub

  images:
    # The pipeline validated the source but never the artefacts, so a
    # Dockerfile that had not kept up with the workspace graph sailed through
    # every green run and only failed on the deployment server.
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build soul image
        run: docker build -f ops/docker/soul.Dockerfile -t ugo-soul:ci .
      - name: soul resolves its workspace dependencies
        run: |
          docker run --rm ugo-soul:ci node -e "
            Promise.all(['@ugo/memory','@ugo/psyche','@ugo/db','@ugo/shared'].map((m) => import(m)))
              .then(() => console.log('all workspace deps resolve'))
              .catch((error) => { console.error(error.message); process.exit(1); })"
      - name: soul carries the face bundle (ADR-018 Tempo 1)
        run: |
          docker run --rm ugo-soul:ci sh -c "
            test -f /app/public/index.html &&
            test -f /app/public/manifest.webmanifest &&
            ls /app/public/icon-512.png &&
            echo 'face bundle present'"
      # ADR-047: questa immagine non era costruita da nessuna parte — non in CI
      # e non in locale (il proxy TLS della sandbox blocca download.pytorch.org).
      # Un Dockerfile mai costruito è un Dockerfile che si scopre rotto al
      # deploy, che è esattamente il motivo per cui questo job esiste.
      - name: build percezione image
        run: docker build -f ops/docker/percezione.Dockerfile -t ugo-percezione:ci .
      - name: percezione has its encoders and its entrypoint
        run: |
          docker run --rm --entrypoint sh ugo-percezione:ci -c "
            python -c 'import torch, speechbrain, onnxruntime, fastapi' &&
            python -c 'from ugo_jobs.ecapa import EcapaVoiceEncoder; from ugo_jobs.arcface import ArcFaceEncoder' &&
            test -x /usr/local/bin/entrypoint.sh &&
            test -x /usr/local/bin/fetch-models.sh &&
            echo 'percezione pronta'"
      # senza volume scrivibile il container deve FERMARSI, non partire e
      # riscaricare 250 MB a ogni riavvio in silenzio
      - name: percezione refuses to start without a writable models volume
        run: |
          if docker run --rm --read-only --tmpfs /tmp ugo-percezione:ci; then
            echo "è partita senza volume: non doveva" >&2
            exit 1
          fi
          echo "si è fermata, come deve"
      - name: build jobs image
        run: docker build -f ops/docker/jobs.Dockerfile -t ugo-jobs:ci .
      # --entrypoint: the image's entrypoint IS the dream, so a bare command
      # would be parsed as arguments to it
      - name: jobs image has the dream and a pg_dump that matches the server
        run: |
          docker run --rm --entrypoint sh ugo-jobs:ci -c "
            python -c 'import ugo_jobs.dream' &&
            MAJOR=\$(pg_dump --version | sed -E 's/.* ([0-9]+).*/\1/') &&
            echo \"pg_dump major: \$MAJOR\" &&
            [ \"\$MAJOR\" -ge 16 ] &&
            python -c 'from ugo_jobs.scheduler import next_run_at, parse_at' &&
            test \"\$(whoami)\" = ugo &&
            echo 'dream imports, scheduler imports, pg_dump new enough, non-root'"

  apk:
    # ADR-018 said the Android toolchain was not verifiable here, and that a
    # broken shell would be discovered on the phone instead of in the pipeline.
    name: android shell (debug apk)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the web app the shell wraps
        # turbo, not a bare filter: the face depends on @ugo/shared, and only
        # turbo knows to build the workspace dependency first
        run: pnpm turbo build --filter=face
      - name: sync capacitor
        working-directory: apps/face-android
        run: npx cap sync android
      - name: assemble the debug apk
        working-directory: apps/face-android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: the apk carries the permissions the shell exists for
        working-directory: apps/face-android/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/aapt2
          for perm in RECORD_AUDIO FOREGROUND_SERVICE_MICROPHONE BLUETOOTH_ADVERTISE WAKE_LOCK; do
            "$AAPT" dump permissions "$APK" | grep -q "$perm" \
              || { echo "missing permission: $perm"; exit 1; }
          done
          echo "apk built with the permissions a browser tab cannot have"
      - name: name the package after the commit it came from
        working-directory: apps/face-android/android
        run: |
          mkdir -p ../../../dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../../../dist/ugo-${GITHUB_SHA::7}.apk"
      # Releases, not artifacts: an artifact expires in ninety days and lives
      # behind the Actions tab. The owner installs this from a phone, and a
      # link that keeps working is the whole point.
      - name: publish the apk on the rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one rolling release, replaced each time: for a debug build the only
          # interesting version is the current one, and the link stays the same
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest "dist/ugo-${GITHUB_SHA::7}.apk" \
            --prerelease \
            --title "UGO — APK di sviluppo" \
            --notes-file apps/face-android/RELEASE_NOTES.md
